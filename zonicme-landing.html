<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ZonicMe — one city, every move</title>
<style>
  :root{ --bg:#05070F; --ink:#EAF2FF; --muted:#8794AD; --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14); }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:
      radial-gradient(1200px 700px at 50% -10%, rgba(124,108,255,.12), transparent 60%),
      radial-gradient(900px 600px at 90% 110%, rgba(34,211,238,.08), transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased; min-height:100%; display:flex; flex-direction:column;
  }
  .stars{position:fixed;inset:0;pointer-events:none;z-index:0}
  .stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.5;animation:tw 4s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.12}50%{opacity:.7}}
  .wrap{position:relative;z-index:1;width:100%;max-width:980px;margin:0 auto;padding:64px 24px 40px;flex:1}
  header{text-align:center;margin-bottom:54px}
  .brand{font-size:clamp(34px,6vw,56px);font-weight:800;letter-spacing:-1.5px}
  .brand b{background:linear-gradient(90deg,#A78BFA,#22D3EE 60%,#2DD4BF);-webkit-background-clip:text;background-clip:text;color:transparent}
  .tag{margin-top:12px;color:var(--muted);font-size:clamp(13px,2.4vw,16px);letter-spacing:.2px}
  .eyebrow{font-size:11px;letter-spacing:3px;color:var(--muted);text-transform:uppercase;margin-bottom:14px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  @media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:480px){.grid{grid-template-columns:1fr}}
  .app{appearance:none;border:0;text-align:left;cursor:pointer;background:#070A14;color:inherit;padding:22px 20px;display:flex;flex-direction:column;gap:6px;position:relative;transition:background .25s,transform .25s}
  .app:hover{background:#0B1020}
  .app .name{font-size:20px;font-weight:700;letter-spacing:-.3px;display:flex;align-items:center;gap:9px}
  .app .dot{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c);flex:none}
  .app .role{font-size:12.5px;color:var(--muted);letter-spacing:.2px}
  .app .arrow{position:absolute;top:20px;right:18px;color:var(--muted);opacity:0;transform:translateX(-4px);transition:.25s}
  .app:hover .arrow{opacity:1;transform:translateX(0);color:var(--c)}
  .app::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c);transform:scaleY(0);transform-origin:top;transition:transform .25s}
  .app:hover::after{transform:scaleY(1)}
  footer{position:relative;z-index:1;text-align:center;color:var(--muted);font-size:12px;letter-spacing:.4px;padding:22px}
  .scrim{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(3,5,12,.62);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;transition:opacity .22s}
  .scrim.show{display:flex;opacity:1}
  .reveal{width:100%;max-width:440px;background:#0A0E1A;border:1px solid var(--line-2);border-radius:16px;padding:30px 28px 26px;box-shadow:0 30px 90px rgba(0,0,0,.6);transform:translateY(10px) scale(.98);opacity:0;transition:transform .26s cubic-bezier(.2,.7,.2,1),opacity .26s;position:relative}
  .scrim.show .reveal{transform:none;opacity:1}
  .reveal .glow{position:absolute;inset:-1px;border-radius:16px;padding:1px;background:linear-gradient(160deg,var(--c),transparent 45%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;opacity:.7}
  .reveal .k{font-size:11px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--c)}
  .reveal h3{font-size:28px;font-weight:800;letter-spacing:-.6px;margin:8px 0 14px}
  .reveal p{font-size:15px;line-height:1.6;color:#AEB9CE;margin-bottom:24px}
  .reveal .go{display:inline-flex;align-items:center;gap:8px;background:var(--c);color:#06090F;font-size:14px;font-weight:700;text-decoration:none;padding:12px 18px;border-radius:9px;transition:transform .15s,filter .15s}
  .reveal .go:hover{transform:translateY(-1px);filter:brightness(1.06)}
  .reveal .soon{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);border:1px dashed var(--line-2);padding:11px 16px;border-radius:9px}
  .reveal .x{position:absolute;top:14px;right:16px;width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:18px;cursor:pointer;line-height:1;display:flex;align-items:center;justify-content:center;transition:.18s}
  .reveal .x:hover{color:var(--ink);border-color:var(--line-2)}
</style>
</head>
<body>
<div class="stars" id="stars" aria-hidden="true"></div>
<div class="wrap">
  <header>
    <div class="eyebrow">ZonicMe Limited &middot; Abuja</div>
    <div class="brand">Zonic<b>Me</b></div>
    <p class="tag">One city, every move. Nine apps, one ecosystem &mdash; tap any name to step inside.</p>
  </header>
  <div class="grid" id="grid" role="list"></div>
</div>
<footer>&copy; <span id="yr"></span> ZonicMe Limited &mdash; built in Abuja, for Africa.</footer>
<div class="scrim" id="scrim" role="dialog" aria-modal="true">
  <div class="reveal" id="reveal" style="--c:#A78BFA">
    <span class="glow"></span>
    <button class="x" id="closeX" aria-label="Close">&times;</button>
    <div class="k" id="rKick"></div>
    <h3 id="rName"></h3>
    <p id="rDesc"></p>
    <div id="rAction"></div>
  </div>
</div>
<script>
  const APPS = [
    { name:"MyAfriart",        c:"#A78BFA", role:"African art, collected",  url:"",
      desc:"Discover and collect original African art \u2014 browse artists and pieces, preview a work on your own wall with AI room-staging, and check out with diaspora-friendly payments and worldwide shipping." },
    { name:"MyYanga",          c:"#22D3EE", role:"Fashion, for the culture", url:"https://www.myyanga.com",
      desc:"Shop vetted Nigerian designers \u2014 aso-ebi, ready-to-wear and occasion pieces \u2014 with sizes, virtual try-on and a sleek checkout. MyYanga brokers the deal; you buy directly from the brand." },
    { name:"AdSpot",           c:"#2DD4BF", role:"Attention, rewarded",     url:"",
      desc:"Watch brand ads, answer a quick question, earn XP and weekly cash payouts. Brands get real, measured attention; you get paid for yours." },
    { name:"Rubba",            c:"#F6C982", role:"Life, planned",           url:"",
      desc:"Your money genie. Set goals and savings for everything from celebrations to retirement and legacy, with location-aware costs across Nigerian cities." },
    { name:"Owanbe",           c:"#FB7185", role:"Celebrations, handled",   url:"",
      desc:"Plan your owambe end to end \u2014 book the right vendors across 30+ categories with live budgets, timelines and payments in one place." },
    { name:"NotifyMe",         c:"#38BDF8", role:"Banking access, watched", url:"",
      desc:"Real-time security alerts the moment your banking records are accessed \u2014 multi-channel notifications and a dual-approval investigation console for peace of mind." },
    { name:"Game of Proverbs", c:"#C084FC", role:"Wisdom, played",          url:"",
      desc:"A short-video game of African proverbs \u2014 watch a scene, pick the proverb that fits, and climb the leaderboard across Yoruba, Igbo, Hausa and Swahili." },
    { name:"InfluencerMatch",  c:"#34D399", role:"Creators, matched",       url:"",
      desc:"Connect brands with the right African creators \u2014 discovery, briefs and campaign tracking that match audience to intent." },
    { name:"EduChatRooms",     c:"#FBBF24", role:"Learning, together",      url:"",
      desc:"Topic-based study rooms and tutoring chat \u2014 learn together in focused spaces built for African classrooms and curricula." },
  ];
  const stars=document.getElementById("stars");
  for(let i=0;i<70;i++){const s=document.createElement("i");s.style.left=Math.random()*100+"%";s.style.top=Math.random()*100+"%";s.style.animationDelay=(Math.random()*4)+"s";s.style.opacity=(.2+Math.random()*.5);stars.appendChild(s);}
  document.getElementById("yr").textContent=new Date().getFullYear();
  const grid=document.getElementById("grid");
  APPS.forEach((a,i)=>{
    const b=document.createElement("button");
    b.className="app";b.style.setProperty("--c",a.c);b.setAttribute("role","listitem");
    b.innerHTML=`<span class="name"><span class="dot"></span>${a.name}</span><span class="role">${a.role}</span><span class="arrow">&rarr;</span>`;
    b.addEventListener("click",()=>openReveal(i));
    grid.appendChild(b);
  });
  const scrim=document.getElementById("scrim"),reveal=document.getElementById("reveal");
  const rKick=document.getElementById("rKick"),rName=document.getElementById("rName"),rDesc=document.getElementById("rDesc"),rAction=document.getElementById("rAction");
  function openReveal(i){
    const a=APPS[i];
    reveal.style.setProperty("--c",a.c);
    rKick.textContent=a.role;rName.textContent=a.name;rDesc.textContent=a.desc;
    rAction.innerHTML=a.url?`<a class="go" href="${a.url}" target="_blank" rel="noopener">Visit ${a.name} &rarr;</a>`:`<span class="soon">Site launching soon</span>`;
    scrim.classList.add("show");
  }
  function close(){scrim.classList.remove("show");}
  document.getElementById("closeX").addEventListener("click",close);
  scrim.addEventListener("click",(e)=>{if(e.target===scrim)close();});
  document.addEventListener("keydown",(e)=>{if(e.key==="Escape")close();});
</script>
</body>
</html>
