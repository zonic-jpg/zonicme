<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ZonicMe — the connected city</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#04060F;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .stage{position:relative;width:100%;max-width:1280px;margin:0 auto}
  svg{width:100%;height:auto;display:block}
  .overlay{position:absolute;inset:0}
  /* interactive markers sit over each person */
  .spot{position:absolute;transform:translate(-50%,-50%);cursor:pointer;background:none;border:none;padding:0}
  .ring{width:38px;height:38px;border-radius:50%;border:2px solid var(--c);box-shadow:0 0 14px var(--c);
    display:flex;align-items:center;justify-content:center;animation:pulse 2.4s ease-in-out infinite}
  .ring::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
  .spot:hover .ring{transform:scale(1.18)}
  .tag{position:absolute;left:50%;top:-26px;transform:translateX(-50%);white-space:nowrap;font-size:11px;
    font-weight:700;letter-spacing:1px;color:#fff;background:rgba(8,14,28,.85);border:1px solid var(--c);
    padding:3px 8px;border-radius:3px;opacity:0;transition:opacity .2s;pointer-events:none}
  .spot:hover .tag{opacity:1}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.12);opacity:1}}
  /* reveal card */
  .card{position:absolute;width:250px;background:#0A1020;border:1px solid var(--c);border-radius:4px;
    padding:16px;color:#EAF2FF;z-index:20;transform:translate(-50%,-110%);box-shadow:0 20px 60px rgba(0,0,0,.6);display:none}
  .card.show{display:block}
  .card .k{font-size:10px;font-weight:700;letter-spacing:2px;color:var(--c)}
  .card h3{font-size:20px;font-weight:800;margin:2px 0 6px;letter-spacing:-.3px}
  .card p{font-size:13px;line-height:1.5;color:#9FB0C9;margin-bottom:12px}
  .card a{display:inline-flex;align-items:center;gap:6px;background:#fff;color:#0A1020;font-size:13px;
    font-weight:700;text-decoration:none;padding:9px 14px;border-radius:3px}
  .card .x{position:absolute;top:8px;right:10px;color:#5b657a;cursor:pointer;font-size:18px;line-height:1}
  .hint{text-align:center;color:#46506a;font-size:12px;letter-spacing:1px;padding:14px}
  .star{animation:tw 4s ease-in-out infinite}@keyframes tw{0%,100%{opacity:.2}50%{opacity:.9}}
  .node{animation:np 3s ease-in-out infinite}@keyframes np{0%,100%{opacity:.4}50%{opacity:1}}
  /* --- motion: a living city --- */
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  @keyframes bob2{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  @keyframes sway{0%,100%{transform:translateY(0) rotate(0deg)}25%{transform:translateY(-3px) rotate(.8deg)}75%{transform:translateY(-3px) rotate(-.8deg)}}
  @keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  @keyframes flicker{0%,100%{opacity:1}48%{opacity:1}50%{opacity:.4}52%{opacity:1}70%{opacity:.7}72%{opacity:1}}
  @keyframes drive{0%{transform:translateX(-760px)}100%{transform:translateX(820px)}}
  @keyframes drift{0%,100%{transform:translateX(0)}50%{transform:translateX(16px)}}
  .fig{transform-box:fill-box;transform-origin:center bottom}
  .idle{transform-box:fill-box;transform-origin:center bottom;animation:bob 4s ease-in-out infinite}
  .walk{transform-box:fill-box;transform-origin:center bottom;animation:sway 2.2s ease-in-out infinite}
  .danceA{transform-box:fill-box;transform-origin:center bottom;animation:bob2 1.05s ease-in-out infinite}
  .floaty{transform-box:fill-box;transform-origin:center;animation:floatY 3s ease-in-out infinite}
  .neon{animation:flicker 6s infinite}
  .car{animation:drive 9s linear infinite}
  .crowd{animation:drift 8s ease-in-out infinite}
</style>
</head>
<body>
<div class="stage" id="stage">
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="sky" cx="50%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#1A2350"/><stop offset="40%" stop-color="#0C1330"/><stop offset="100%" stop-color="#05070F"/>
    </radialGradient>
    <linearGradient id="hzn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0"/><stop offset="100%" stop-color="#2DD4BF" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="street" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1228"/><stop offset="100%" stop-color="#04060F"/>
    </linearGradient>
    <radialGradient id="lamp" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#F6C982" stop-opacity=".5"/><stop offset="100%" stop-color="#F6C982" stop-opacity="0"/></radialGradient>
    <radialGradient id="moon" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#cfe0ff" stop-opacity=".9"/><stop offset="100%" stop-color="#cfe0ff" stop-opacity="0"/></radialGradient>
    <pattern id="win" width="14" height="18" patternUnits="userSpaceOnUse">
      <rect width="14" height="18" fill="#0a1330"/><rect x="3" y="3" width="4" height="5" fill="#2A3E72"/><rect x="9" y="9" width="3" height="4" fill="#C9913E" opacity=".8"/>
    </pattern>
    <pattern id="winC" width="12" height="16" patternUnits="userSpaceOnUse">
      <rect width="12" height="16" fill="#0a1730"/><rect x="3" y="3" width="3" height="4" fill="#1f6f72"/><rect x="7" y="9" width="3" height="3" fill="#2DD4BF" opacity=".7"/>
    </pattern>
    <filter id="g" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="blur"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <!-- sky -->
  <rect width="1280" height="600" fill="url(#sky)"/>
  <circle cx="1080" cy="120" r="46" fill="url(#moon)"/><circle cx="1080" cy="120" r="22" fill="#e7eefc"/>
  <g fill="#dce8ff">
    <circle class="star" cx="160" cy="70" r="1.4"/><circle class="star" cx="300" cy="130" r="1" style="animation-delay:1s"/>
    <circle class="star" cx="520" cy="60" r="1.2" style="animation-delay:2s"/><circle class="star" cx="760" cy="100" r="1" style="animation-delay:.5s"/>
    <circle class="star" cx="940" cy="60" r="1.3" style="animation-delay:1.5s"/><circle class="star" cx="220" cy="180" r="1" style="animation-delay:2.5s"/>
    <circle class="star" cx="640" cy="150" r="1.1" style="animation-delay:3s"/>
  </g>
  <rect y="380" width="1280" height="220" fill="url(#hzn)"/>

  <!-- FAR skyline -->
  <g>
    <rect x="20" y="240" width="80" height="300" fill="url(#win)"/>
    <rect x="110" y="300" width="60" height="240" fill="url(#winC)"/>
    <rect x="180" y="200" width="74" height="340" fill="url(#win)"/>
    <rect x="1010" y="220" width="84" height="320" fill="url(#win)"/>
    <rect x="1100" y="290" width="64" height="250" fill="url(#winC)"/>
    <rect x="1172" y="250" width="80" height="290" fill="url(#win)"/>
    <rect x="430" y="270" width="70" height="270" fill="url(#winC)"/>
    <rect x="800" y="250" width="76" height="290" fill="url(#win)"/>
  </g>
  <!-- MID buildings -->
  <g>
    <rect x="265" y="320" width="120" height="220" fill="url(#win)"/>
    <rect x="540" y="290" width="120" height="250" fill="url(#winC)"/>
    <rect x="690" y="330" width="110" height="210" fill="url(#win)"/>
    <rect x="900" y="300" width="118" height="240" fill="url(#winC)"/>
  </g>

  <!-- neon billboards -->
  <g filter="url(#g)" class="neon">
    <rect x="556" y="305" width="88" height="48" rx="3" fill="#0a1626" stroke="#A78BFA" stroke-width="1.5"/>
    <text x="600" y="335" text-anchor="middle" fill="#A78BFA" font-size="15" font-weight="800">ZONIC</text>
    <rect x="915" y="316" width="86" height="42" rx="3" fill="#0a1626" stroke="#2DD4BF" stroke-width="1.5"/>
    <polygon points="945,328 945,348 963,338" fill="#2DD4BF"/>
    <text x="978" y="343" text-anchor="middle" fill="#2DD4BF" font-size="12" font-weight="800">AD</text>
  </g>

  <!-- network spine weaving between towers -->
  <g stroke="#2DD4BF" stroke-width="1.2" fill="none" opacity=".5">
    <path d="M150,230 C330,180 480,300 640,250 C820,195 960,300 1130,240"/>
    <path d="M300,300 C460,260 600,330 760,300"/>
  </g>
  <g fill="#22D3EE"><circle class="node" cx="150" cy="230" r="4"/><circle class="node" cx="640" cy="250" r="5" style="animation-delay:1s"/><circle class="node" cx="1130" cy="240" r="4" style="animation-delay:.6s"/><circle class="node" cx="760" cy="300" r="3" style="animation-delay:1.4s"/></g>

  <!-- STREET -->
  <rect y="540" width="1280" height="180" fill="url(#street)"/>
  <g stroke="#1a2banner" opacity=".4" stroke="#22324f"><line x1="0" y1="540" x2="1280" y2="540"/></g>
  <!-- perspective + neon reflections -->
  <g stroke="#2DD4BF" opacity=".12"><line x1="640" y1="540" x2="200" y2="720"/><line x1="640" y1="540" x2="1080" y2="720"/><line x1="640" y1="540" x2="520" y2="720"/><line x1="640" y1="540" x2="760" y2="720"/></g>
  <g opacity=".25" filter="url(#blur)"><rect x="240" y="600" width="6" height="90" fill="#A78BFA"/><rect x="480" y="600" width="6" height="100" fill="#2DD4BF"/><rect x="690" y="610" width="6" height="90" fill="#22D3EE"/><rect x="900" y="600" width="6" height="100" fill="#A78BFA"/><rect x="1090" y="600" width="6" height="90" fill="#FB7185"/></g>

  <!-- lamp posts -->
  <g>
    <circle cx="360" cy="500" r="40" fill="url(#lamp)"/><line x1="360" y1="500" x2="360" y2="600" stroke="#1c2640" stroke-width="3"/><circle cx="360" cy="500" r="5" fill="#F6C982"/>
    <circle cx="980" cy="500" r="40" fill="url(#lamp)"/><line x1="980" y1="500" x2="980" y2="600" stroke="#1c2640" stroke-width="3"/><circle cx="980" cy="500" r="5" fill="#F6C982"/>
  </g>

  <!-- keke / car with headlights -->
  <g class="car">
    <rect x="560" y="520" width="60" height="26" rx="6" fill="#142038"/><rect x="575" y="510" width="34" height="16" rx="4" fill="#16263f"/>
    <circle cx="572" cy="548" r="6" fill="#0a0f1c"/><circle cx="608" cy="548" r="6" fill="#0a0f1c"/>
    <polygon points="620,530 700,520 700,545 620,540" fill="#F6C982" opacity=".25"/>
  </g>

  <!-- background crowd (non-interactive, depth) -->
  <g fill="#0c1628" opacity=".85" class="crowd">
    <g transform="translate(420,512) scale(.6)"><circle cx="0" cy="0" r="8"/><path d="M0,8 q-12,3 -12,28 l0,26 l24,0 l0,-26 q0,-25 -12,-28Z"/></g>
    <g transform="translate(720,510) scale(.55)"><circle cx="0" cy="0" r="8"/><path d="M0,8 q-12,3 -12,28 l0,26 l24,0 l0,-26 q0,-25 -12,-28Z"/></g>
    <g transform="translate(560,508) scale(.5)"><circle cx="0" cy="0" r="8"/><path d="M0,8 q-12,3 -12,28 l0,26 l24,0 l0,-26 q0,-25 -12,-28Z"/></g>
    <g transform="translate(1010,512) scale(.55)"><circle cx="0" cy="0" r="8"/><path d="M0,8 q-12,3 -12,28 l0,26 l24,0 l0,-26 q0,-25 -12,-28Z"/></g>
  </g>

  <!-- ============ FOREGROUND INTERACTIVE FIGURES ============ -->
  <!-- 1 ARTIST → MyAfriart  (~x230) -->
  <g filter="url(#g)" class="idle">
    <ellipse cx="230" cy="612" rx="70" ry="12" fill="url(#lamp)" opacity=".4"/>
    <line x1="196" y1="560" x2="196" y2="620" stroke="#6B5638" stroke-width="3"/><line x1="224" y1="560" x2="224" y2="620" stroke="#6B5638" stroke-width="3"/>
    <rect x="184" y="548" width="52" height="44" fill="#0e1d28"/><rect x="189" y="553" width="42" height="34" fill="#1b3340"/>
    <path d="M194,575 q9,-16 20,-5 q7,7 16,-3" stroke="#F2A65A" stroke-width="3" fill="none"/><circle cx="200" cy="562" r="3" fill="#E94F37"/><circle cx="223" cy="568" r="3" fill="#7C3AED"/>
    <g fill="#0A1420" stroke="#A78BFA" stroke-width="1" stroke-opacity=".5">
      <circle cx="262" cy="556" r="9"/><path d="M262,565 q-14,3 -14,30 l0,30 l28,0 l0,-30 q0,-27 -14,-30Z"/><path d="M250,588 l-18,-12" stroke-width="6" stroke="#0A1420" stroke-opacity="1" stroke-linecap="round"/>
    </g>
  </g>

  <!-- 2 FASHION LADY → MyYanga (~x474) -->
  <g filter="url(#g)" class="walk">
    <ellipse cx="474" cy="616" rx="60" ry="11" fill="url(#lamp)" opacity=".35"/>
    <g fill="#0A1420" stroke="#2DD4BF" stroke-width="1" stroke-opacity=".55">
      <circle cx="474" cy="552" r="9"/>
      <path d="M474,561 q-9,2 -10,16 l-12,62 l44,0 l-12,-62 q-1,-14 -10,-16Z"/>
      <path d="M466,592 l-14,9" stroke="#0A1420" stroke-width="5" stroke-opacity="1" stroke-linecap="round"/>
    </g>
    <rect x="448" y="592" width="11" height="17" rx="2" fill="#22D3EE" filter="url(#g)"/><rect x="449" y="593" width="9" height="15" rx="1" fill="#cdf7ff"/>
  </g>

  <!-- 3 AD WATCHER → AdSpot (~x666) looking up at billboard -->
  <g filter="url(#g)" class="idle">
    <ellipse cx="666" cy="620" rx="60" ry="11" fill="url(#lamp)" opacity=".35"/>
    <g fill="#0A1420" stroke="#2DD4BF" stroke-width="1" stroke-opacity=".55">
      <circle cx="666" cy="560" r="9"/><path d="M666,569 q-14,3 -14,30 l0,32 l28,0 l0,-32 q0,-27 -14,-30Z"/>
      <path d="M680,588 l16,-10" stroke="#0A1420" stroke-width="5" stroke-opacity="1" stroke-linecap="round"/>
    </g>
    <circle class="node floaty" cx="700" cy="556" r="9" fill="#F6C982"/><text x="700" y="560" text-anchor="middle" fill="#5a3d10" font-size="9" font-weight="800">₦</text>
    <polygon points="712,544 718,532 724,544" fill="#2DD4BF"/>
  </g>

  <!-- 4 PLANNER → Rubba (~x883) seated at café table -->
  <g filter="url(#g)" class="idle">
    <ellipse cx="883" cy="618" rx="64" ry="11" fill="url(#lamp)" opacity=".35"/>
    <rect x="900" y="592" width="44" height="4" fill="#1c2a44"/><line x1="906" y1="596" x2="906" y2="616" stroke="#1c2a44" stroke-width="3"/><line x1="938" y1="596" x2="938" y2="616" stroke="#1c2a44" stroke-width="3"/>
    <g fill="#0A1420" stroke="#A78BFA" stroke-width="1" stroke-opacity=".55">
      <circle cx="868" cy="560" r="9"/><path d="M868,569 q-13,3 -13,28 l0,30 l26,0 l0,-30 q0,-25 -13,-28Z"/>
      <path d="M880,586 l16,4" stroke="#0A1420" stroke-width="5" stroke-opacity="1" stroke-linecap="round"/>
    </g>
    <circle cx="922" cy="566" r="12" fill="none" stroke="#2DD4BF" stroke-width="2"/><circle cx="922" cy="566" r="5" fill="none" stroke="#A78BFA" stroke-width="2"/><circle class="node" cx="922" cy="566" r="2" fill="#fff"/>
    <g fill="#F6C982"><ellipse cx="912" cy="592" rx="9" ry="3"/><ellipse cx="912" cy="588" rx="9" ry="3"/></g>
  </g>

  <!-- 5 CELEBRATION → Owanbe (~x1088) -->
  <g filter="url(#g)" class="danceA">
    <ellipse cx="1088" cy="616" rx="80" ry="12" fill="url(#lamp)" opacity=".4"/>
    <g fill="#0A1420" stroke="#FB7185" stroke-width="1" stroke-opacity=".55">
      <circle cx="1058" cy="556" r="8"/><path d="M1058,564 q-12,3 -12,26 l0,30 l24,0 l0,-30 q0,-23 -12,-26Z"/><path d="M1048,582 l-12,-12 M1068,582 l12,-8" stroke="#0A1420" stroke-width="5" stroke-opacity="1" stroke-linecap="round"/>
      <circle cx="1112" cy="548" r="8"/><path d="M1112,556 q-12,3 -12,26 l0,32 l24,0 l0,-32 q0,-23 -12,-26Z"/><path d="M1102,574 l-10,-12 M1122,574 l12,-6" stroke="#0A1420" stroke-width="5" stroke-opacity="1" stroke-linecap="round"/>
    </g>
    <path d="M1138,596 l7,24 l14,0 l7,-24Z" fill="#6B4A2A"/><ellipse cx="1148" cy="596" rx="14" ry="4" fill="#E9D5B0"/>
    <g class="node"><rect x="1070" y="520" width="5" height="5" fill="#A78BFA"/><rect x="1110" y="512" width="5" height="5" fill="#2DD4BF" style="animation-delay:1s"/><circle cx="1090" cy="510" r="3" fill="#F6C982"/></g>
  </g>

  <!-- wordmark -->
  <g>
    <rect x="60" y="46" width="16" height="16" fill="#2DD4BF"/>
    <text x="84" y="62" fill="#fff" font-size="24" font-weight="800" letter-spacing="-.5">ZonicMe</text>
    <text x="62" y="92" fill="#C7D3E8" font-size="15" font-weight="600">One city. Every everyday moment, connected.</text>
  </g>
</svg>

<div class="overlay" id="overlay"></div>
</div>
<div class="hint">Tap any glowing figure in the city to reveal the app and enter it.</div>

<script>
  const APPS = [
    { id:"myafriart", name:"MyAfriart", c:"#A78BFA", x:18.2, y:74, url:"#",
      desc:"The artist at the easel. Discover and collect original African art, with worldwide shipping and diaspora-friendly checkout." },
    { id:"myyanga", name:"MyYanga", c:"#22D3EE", x:37, y:75, url:"#",
      desc:"The stylist on the move. Shop Nigerian designers, aso-ebi and ready-to-wear, with virtual try-on built for the culture." },
    { id:"adspot", name:"AdSpot", c:"#2DD4BF", x:52, y:77, url:"#",
      desc:"Watching the billboard and earning. Gamified brand ads, XP and weekly cash payouts for your attention." },
    { id:"rubba", name:"Rubba", c:"#A78BFA", x:69, y:77, url:"#",
      desc:"Planning at the table. Goals and savings for everything from celebrations to retirement and legacy, in one place." },
    { id:"owanbe", name:"Owanbe", c:"#FB7185", x:85, y:74, url:"#",
      desc:"The celebration. Plan your owambe end to end and book the right vendors across 30+ categories with live budgets." },
  ];
  const overlay = document.getElementById("overlay");
  let card = null;

  function closeCard(){ if(card){ card.remove(); card=null; } }
  document.addEventListener("click", (e)=>{ if(card && !e.target.closest(".card") && !e.target.closest(".spot")) closeCard(); });

  APPS.forEach((a)=>{
    const b = document.createElement("button");
    b.className = "spot"; b.style.left = a.x+"%"; b.style.top = a.y+"%"; b.style.setProperty("--c", a.c);
    b.innerHTML = `<span class="tag" style="--c:${a.c}">${a.name.toUpperCase()}</span><span class="ring"></span>`;
    b.addEventListener("click",(e)=>{
      e.stopPropagation(); closeCard();
      card = document.createElement("div");
      card.className = "card show"; card.style.setProperty("--c", a.c);
      card.style.left = a.x+"%"; card.style.top = (a.y-4)+"%";
      card.innerHTML = `<span class="x">&times;</span><div class="k" style="color:${a.c}">${a.name.toUpperCase()}</div>
        <h3>${a.name}</h3><p>${a.desc}</p><a href="${a.url}" target="_blank" rel="noopener">Open ${a.name} &rarr;</a>`;
      card.querySelector(".x").addEventListener("click", closeCard);
      overlay.appendChild(card);
      // clamp horizontally
      const r = card.getBoundingClientRect(), o = overlay.getBoundingClientRect();
      if (r.left < o.left) card.style.transform = "translate(0,-110%)";
      else if (r.right > o.right) card.style.transform = "translate(-100%,-110%)";
    });
    overlay.appendChild(b);
  });
</script>
</body>
</html>
