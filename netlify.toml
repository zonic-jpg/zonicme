# ZonicMe hub - static site (no build step). Publish website root.
[build]
  publish = "."
  command = ""

# Static assets must win over SPA fallback (js/config/orbit/assets/admin.html).
[[redirects]]
  from = "/js/*"
  to = "/js/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/config/*"
  to = "/config/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/orbit/*"
  to = "/orbit/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/admin.html"
  to = "/admin.html"
  status = 200
  force = true

# Config admin panel (content loaders bookmark /config)
[[redirects]]
  from = "/config"
  to = "/admin.html"
  status = 302
  force = true

# No /* to index.html catch-all - it breaks /js/*.js and /config/*.json on the static hub.
